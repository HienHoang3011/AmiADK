version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(pathname)s:%(lineno)d - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/adkami.log
    maxBytes: 10485760  
    backupCount: 5
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/error.log
    backupCount: 5
    encoding: utf8

loggers:
  # Root logger
  '':
    level: INFO
    handlers: [console, file, error_file]
    propagate: true
  
  # Application specific loggers
  adkami:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: false

  # Third-party libraries
  urllib3:
    level: WARNING
    handlers: [console, file]
    propagate: false